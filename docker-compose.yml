services:
  postgres:
    # Use Arvan Docker Hub mirror (same as other services on this host)
    image: docker.arvancloud.ir/library/postgres:16-alpine
    container_name: visitly-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visitly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visitly_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-visitly}
    # Bind only to localhost on a free port — do NOT use 5432 (production uses it)
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visitly} -d ${POSTGRES_DB:-visitly}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: host
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    container_name: visitly-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-visitly}:${POSTGRES_PASSWORD:-visitly_dev_change_me}@postgres:5432/${POSTGRES_DB:-visitly}
      VISITLY_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3099:3099"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      network: host
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: visitly-web
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api
    restart: unless-stopped
    profiles: ["web"]

  collector:
    build:
      context: .
      dockerfile: apps/collector/Dockerfile
      network: host
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    container_name: visitly-collector
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-visitly}:${POSTGRES_PASSWORD:-visitly_dev_change_me}@postgres:5432/${POSTGRES_DB:-visitly}
      VISITLY_LOG_SOURCE: ${VISITLY_LOG_SOURCE:-docker}
      VISITLY_DOCKER_CONTAINER: ${VISITLY_DOCKER_CONTAINER:-hamerz-nginx-edge}
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["collector"]
    restart: unless-stopped
