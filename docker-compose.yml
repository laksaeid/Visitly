services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: visitly-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visitly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visitly_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-visitly}
    # Bind only to localhost on a free port — do NOT use 5432 (production often uses it)
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visitly} -d ${POSTGRES_DB:-visitly}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: host
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: visitly-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-visitly}:${POSTGRES_PASSWORD:-visitly_dev_change_me}@postgres:5432/${POSTGRES_DB:-visitly}
      VISITLY_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3099:3099"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional separate static front (API image already embeds the SPA)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      network: host
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: visitly-web
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api
    restart: unless-stopped
    profiles: ["web"]

  collector:
    build:
      context: .
      dockerfile: apps/collector/Dockerfile
      network: host
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    container_name: visitly-collector
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-visitly}:${POSTGRES_PASSWORD:-visitly_dev_change_me}@postgres:5432/${POSTGRES_DB:-visitly}
      VISITLY_LOG_SOURCE: ${VISITLY_LOG_SOURCE:-docker}
      VISITLY_DOCKER_CONTAINER: ${VISITLY_DOCKER_CONTAINER:-nginx}
      VISITLY_LOCK_PATH: ${VISITLY_LOCK_PATH:-/var/lib/visitly/collect.lock}
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /usr/bin/docker:/usr/bin/docker:ro
      # Host nginx log dir for VISITLY_LOG_SOURCE=file (override via .env)
      - ${VISITLY_HOST_LOG_DIR:-/var/log/nginx}:/var/log/nginx:ro
      # Persist flock across ephemeral `compose run --rm` containers
      - ${VISITLY_LOCK_DIR:-/var/lib/visitly}:/var/lib/visitly
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["collector"]
    restart: unless-stopped
