[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visitly-core"
version = "0.1.0"
description = "Shared domain logic for Visitly self-hosted analytics"
requires-python = ">=3.10"
dependencies = [
  "sqlalchemy>=2.0.25",
  "psycopg[binary]>=3.1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
